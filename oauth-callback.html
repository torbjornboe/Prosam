<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <script>
    // Token comes back in the URL hash as #access_token=...
    const params = new URLSearchParams(window.location.hash.substring(1));
    const token = params.get("access_token");
    const expires = params.get("expires_in");

    if (token && window.opener) {
      window.opener.postMessage(
        { type: "arcgis:auth:success", token: token, expires: expires },
        "https://torbjornboe.github.io"
      );
      window.close();
    }
  </script>
</body>
</html>
