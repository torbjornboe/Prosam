<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://js.arcgis.com/4.29/"></script>
</head>
<body>
  <script>
    require(["esri/identity/IdentityManager"], function(IdentityManager) {
      try {
        IdentityManager.completeOAuth20();
      } catch(e) {
        // Fallback: manually post token back to parent window
        const urlParams = new URLSearchParams(window.location.search);
        const hash = window.location.hash;
        if (window.opener) {
          window.opener.postMessage(
            { type: "arcgis:auth:success", search: window.location.search, hash: hash },
            "https://torbjornboe.github.io"
          );
          window.close();
        }
      }
    });
  </script>
</body>
</html>
